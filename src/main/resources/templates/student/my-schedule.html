<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div class="container mt-5">
    <h3 class="text-center mb-4 text-primary">LỊCH HỌC CÁ NHÂN</h3>
    <a href="/student/home" class="btn btn-secondary mb-3">⬅ Quay lại</a>
    <div class="card shadow">
        <table class="table table-hover">
            <thead class="table-primary">
            <tr><th>Ngày</th><th>Giờ</th><th>Môn học</th><th>Giảng viên</th><th>Phòng</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${schedules}">
                <td th:text="${s.scheduleDate}" class="fw-bold"></td>
                <td th:text="${s.startTime} + ' - ' + ${s.endTime}"></td>
                <td th:text="${s.course.courseName}"></td>
                <td th:text="${s.teacher.fullName}"></td>
                <td><span class="badge bg-info text-dark" th:text="${s.room}"></span></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
