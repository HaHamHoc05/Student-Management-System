<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div class="container mt-5">
    <h3 class="text-center text-primary mb-4">BẢNG ĐIỂM CÁ NHÂN</h3>
    <a href="/student/home" class="btn btn-secondary mb-3">⬅ Quay lại</a>
    <div class="card shadow">
        <table class="table table-hover mb-0">
            <thead class="table-primary">
            <tr><th>Mã môn</th><th>Tên môn</th><th>TC</th><th>Giữa kỳ</th><th>Cuối kỳ</th><th>Tổng điểm</th><th>Điểm chữ</th><th>GPA</th></tr>
            </thead>
            <tbody>
            <tr th:each="g : ${grades}">
                <td th:text="${g.courseCode}"></td>
                <td th:text="${g.courseName}"></td>
                <td th:text="${g.credit}"></td>
                <td th:text="${g.midTerm}"></td>
                <td th:text="${g.finalExam}"></td>
                <td th:text="${g.total}" class="text-danger fw-bold"></td>
                <td th:text="${g.letterGrade}"></td>
                <td th:text="${g.gpa}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
