<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">🎓 STUDENT PORTAL</span>
        <div class="d-flex gap-2">
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-light btn-sm">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h5 class="mb-1">Xin chào, <strong th:text="${student.fullName}"></strong> 👋</h5>
    <p class="text-muted mb-4">Lớp: <span th:text="${student.classRoom?.className}"></span>
        | Mã SV: <span th:text="${student.studentCode}"></span></p>

    <!-- Quick stats -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card shadow-sm border-primary text-center p-3">
                <h6 class="text-muted">Số môn học</h6>
                <h3 class="text-primary fw-bold" th:text="${#lists.size(grades)}">0</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm border-success text-center p-3">
                <h6 class="text-muted">Buổi học tuần này</h6>
                <h3 class="text-success fw-bold" th:text="${#lists.size(weeklySchedules)}">0</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm border-warning text-center p-3">
                <h6 class="text-muted">Chuyên cần</h6>
                <h3 class="fw-bold"
                    th:classappend="${attendancePercent >= 80 ? 'text-success' : 'text-danger'}"
                    th:text="${attendancePercent} + '%'">100%</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm border-info text-center p-3">
                <h6 class="text-muted">GPA TB</h6>
                <h3 class="text-info fw-bold"
                    th:text="${grades.empty ? 'N/A' : #aggregates.avg(grades.![gpa])}">0</h3>
            </div>
        </div>
    </div>

    <!-- Quick links -->
    <div class="row">
        <div class="col-md-3 mb-3">
            <a href="/student/my-grades" class="card shadow text-decoration-none text-center p-4 h-100">
                <div class="fs-1">📊</div>
                <h6 class="fw-bold text-primary mt-2">Bảng điểm</h6>
                <small class="text-muted">Xem điểm giữa kỳ, cuối kỳ, GPA</small>
            </a>
        </div>
        <div class="col-md-3 mb-3">
            <a href="/student/my-schedule" class="card shadow text-decoration-none text-center p-4 h-100">
                <div class="fs-1">📅</div>
                <h6 class="fw-bold text-success mt-2">Thời khóa biểu</h6>
                <small class="text-muted">Lịch học theo lớp</small>
            </a>
        </div>
        <div class="col-md-3 mb-3">
            <a href="/student/my-attendance" class="card shadow text-decoration-none text-center p-4 h-100">
                <div class="fs-1">📌</div>
                <h6 class="fw-bold text-warning mt-2">Điểm danh</h6>
                <small class="text-muted">Lịch sử & % chuyên cần</small>
            </a>
        </div>
        <div class="col-md-3 mb-3">
            <a href="/student/my-profile" class="card shadow text-decoration-none text-center p-4 h-100">
                <div class="fs-1">👤</div>
                <h6 class="fw-bold text-secondary mt-2">Hồ sơ cá nhân</h6>
                <small class="text-muted">Thông tin sinh viên</small>
            </a>
        </div>
    </div>
</div>
</body>
</html>
