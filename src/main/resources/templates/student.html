<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold">🎓 STUDENT PORTAL</span>
        <div class="d-flex align-items-center">
            <span class="text-white me-3 fw-bold" th:text="'SV: ' + ${username}"></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h4 class="mb-4 text-center fw-bold" th:text="'Xin chào Sinh viên ' + ${username} + '!'"></h4>
    <div class="row justify-content-center g-3">

        <div class="col-md-3">
            <div class="card shadow text-center p-4 h-100">
                <h1 class="display-4">📊</h1>
                <h5 class="mt-2">Xem Bảng Điểm</h5>
                <p class="text-muted small">Điểm giữa kỳ, cuối kỳ, GPA.</p>
                <a href="/student/my-grades" class="btn btn-primary mt-auto">Xem chi tiết</a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center p-4 h-100">
                <h1 class="display-4">📅</h1>
                <h5 class="mt-2">Lịch Học</h5>
                <p class="text-muted small">Thời khóa biểu theo lớp.</p>
                <!-- ĐÃ SỬA: href="#" → /student/my-schedule -->
                <a href="/student/my-schedule" class="btn btn-success mt-auto">Xem chi tiết</a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center p-4 h-100">
                <h1 class="display-4">📌</h1>
                <h5 class="mt-2">Điểm Danh</h5>
                <p class="text-muted small">Lịch sử & % chuyên cần.</p>
                <!-- THÊM MỚI: link tới điểm danh cá nhân -->
                <a href="/student/my-attendance" class="btn btn-warning mt-auto">Xem chi tiết</a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center p-4 h-100">
                <h1 class="display-4">👤</h1>
                <h5 class="mt-2">Hồ Sơ Cá Nhân</h5>
                <p class="text-muted small">Thông tin sinh viên, lớp học.</p>
                <!-- THÊM MỚI: link tới thông tin cá nhân -->
                <a href="/student/my-profile" class="btn btn-secondary mt-auto">Xem chi tiết</a>
            </div>
        </div>

    </div>
</div>
</body>
</html>
