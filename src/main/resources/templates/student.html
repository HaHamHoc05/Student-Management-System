<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">🎓 STUDENT PORTAL</span>
        <div class="d-flex align-items-center">
            <span class="text-white me-3 fw-bold" th:text="'SV: ' + ${username}"></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h3 class="mb-4 text-center" th:text="'Xin chào Sinh viên ' + ${username} + '!'"></h3>
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow text-center p-4">
                <h1 class="display-4">📊</h1>
                <h5 class="mt-2">Xem Bảng Điểm</h5>
                <p class="text-muted small">Cập nhật điểm thi, tổng kết, tín chỉ.</p>
                <a href="/students/my-grades" class="btn btn-primary">Xem chi tiết</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow text-center p-4">
                <h1 class="display-4">📅</h1>
                <h5 class="mt-2">Lịch Học & Điểm Danh</h5>
                <p class="text-muted small">Kiểm tra lịch học trong tuần và số ngày vắng.</p>
                <a href="#" class="btn btn-primary">Xem chi tiết</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
