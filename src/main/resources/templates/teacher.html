<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teacher Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">👨‍🏫 TEACHER PORTAL</span>
        <div class="d-flex align-items-center">
            <span class="text-white me-3 fw-bold" th:text="'GV: ' + ${username}"></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4 text-center mb-3">
            <div class="card shadow p-4 border-success border-top border-4">
                <h5>Nhập Điểm Sinh Viên</h5>
                <a href="/grades" class="btn btn-success mt-2">Đi tới</a>
            </div>
        </div>
        <div class="col-md-4 text-center mb-3">
            <div class="card shadow p-4 border-success border-top border-4">
                <h5>Điểm Danh Ký Tên</h5>
                <a href="/attendance" class="btn btn-success mt-2">Đi tới</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
