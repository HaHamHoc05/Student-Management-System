<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teacher Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold">👨‍🏫 TEACHER PORTAL</span>
        <div class="d-flex align-items-center">
            <span class="text-white me-3 fw-bold" th:text="'GV: ' + ${username}"></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h4 class="text-center fw-bold mb-4" th:text="'Xin chào Giảng viên ' + ${username} + '!'"></h4>
    <div class="row justify-content-center g-3">

        <div class="col-md-3">
            <div class="card shadow text-center p-4 h-100 border-top border-success border-4">
                <h1 class="display-4">📝</h1>
                <h5 class="mt-2">Nhập Điểm Sinh Viên</h5>
                <p class="text-muted small">Điểm giữa kỳ, cuối kỳ, GPA tự động tính.</p>
                <a href="/teacher/grades" class="btn btn-success mt-auto">Đi tới</a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center p-4 h-100 border-top border-success border-4">
                <h1 class="display-4">✅</h1>
                <h5 class="mt-2">Điểm Danh</h5>
                <p class="text-muted small">Quản lý điểm danh theo buổi học.</p>
                <a href="/teacher/attendance" class="btn btn-success mt-auto">Đi tới</a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center p-4 h-100 border-top border-success border-4">
                <h1 class="display-4">📅</h1>
                <h5 class="mt-2">Lịch Dạy Của Tôi</h5>
                <p class="text-muted small">Xem lớp + môn được phân công.</p>
                <a href="/teacher/my-schedule" class="btn btn-success mt-auto">Đi tới</a>
            </div>
        </div>

    </div>
</div>
</body>
</html>
