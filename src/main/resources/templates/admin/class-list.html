<div th:replace="~{admin/layout :: layout(~{::content})}">
    <div th:fragment="content">
        <div class="container mt-2">
            <h4 class="fw-bold mb-3">🏫 Quản Lý Lớp Học</h4>
            <div class="row">
                <!-- Form thêm/sửa lớp -->
                <div class="col-md-4">
                    <div class="card shadow-sm p-3">
                        <h5 th:text="${classroom.id != null ? '✏️ Cập nhật lớp' : '➕ Thêm lớp mới'}"></h5>
                        <form th:action="@{/admin/classes/save}" th:object="${classroom}" method="post">
                            <!-- Hidden ID để phân biệt create/update -->
                            <input type="hidden" th:field="*{id}">
                            <div class="mb-3">
                                <label class="form-label">Tên lớp</label>
                                <input type="text" th:field="*{className}" class="form-control"
                                       placeholder="VD: CNTT K15" required>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-fill">
                                    <span th:text="${classroom.id != null ? 'Cập nhật' : 'Thêm'}"></span>
                                </button>
                                <a th:if="${classroom.id != null}" href="/admin/classes"
                                   class="btn btn-secondary">Hủy</a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Bảng danh sách -->
                <div class="col-md-8">
                    <div class="card shadow-sm">
                        <table class="table table-bordered mb-0">
                            <thead class="table-dark text-center">
                            <tr>
                                <th>ID</th>
                                <th>Tên Lớp học</th>
                                <th>Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="c : ${classes}" class="text-center align-middle">
                                <td class="text-muted" th:text="${c.id}"></td>
                                <td class="fw-bold text-start" th:text="${c.className}"></td>
                                <td>
                                    <!-- ĐÃ THÊM: nút Sửa lớp -->
                                    <a th:href="@{/admin/classes/edit/{id}(id=${c.id})}"
                                       class="btn btn-warning btn-sm">✏️ Sửa</a>
                                    <a th:href="@{/admin/classes/delete/{id}(id=${c.id})}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Xóa lớp sẽ ảnh hưởng đến sinh viên trong lớp. Tiếp tục?')">
                                        🗑 Xóa
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(classes)}">
                                <td colspan="3" class="text-center text-muted py-3">Chưa có lớp nào</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
