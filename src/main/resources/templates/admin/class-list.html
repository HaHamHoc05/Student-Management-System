<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Lớp học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h3>Quản lý Lớp học</h3>
    <hr>
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm p-3">
                <h5>Thêm lớp mới</h5>
                <form th:action="@{/admin/classes/save}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Tên lớp</label>
                        <input type="text" name="className" class="form-control" placeholder="VD: CNTT K15" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Thêm</button>
                </form>
            </div>
        </div>
        <div class="col-md-8">
            <table class="table table-bordered bg-white shadow-sm">
                <thead class="table-dark text-center">
                <tr>
                    <th>ID</th>
                    <th>Tên Lớp học</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${classes}">
                    <td class="text-center" th:text="${c.id}"></td>
                    <td th:text="${c.className}"></td>
                    <td class="text-center">
                        <a th:href="@{/admin/classes/delete/{id}(id=${c.id})}"
                           class="text-danger fw-bold"
                           onclick="return confirm('Xóa lớp sẽ ảnh hưởng đến sinh viên trong lớp. Tiếp tục?')">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
