<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${student.id == null ? 'Thêm Sinh viên' : 'Cập nhật Sinh viên'}"></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/students/save}" th:object="${student}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Mã Sinh viên</label>
                            <input type="text" class="form-control" th:field="*{studentCode}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Họ và Tên</label>
                            <input type="text" class="form-control" th:field="*{fullName}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Lớp học</label>
                            <select class="form-select" th:field="*{classRoom.id}">
                                <option value="">-- Chọn lớp --</option>
                                <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.className}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ngày sinh</label>
                            <input type="date" class="form-control" th:field="*{dob}">
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/admin/students" class="btn btn-secondary">Hủy bỏ</a>
                            <button type="submit" class="btn btn-success">Lưu thông tin</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
