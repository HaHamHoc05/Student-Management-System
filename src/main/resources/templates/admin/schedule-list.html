<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch học hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <h3>Lịch học & Giảng dạy</h3>
        <a href="/admin/schedule/add" class="btn btn-dark">Tạo lịch học mới</a>
    </div>
    <table class="table table-striped shadow-sm">
        <thead class="table-primary">
        <tr>
            <th>Lớp</th>
            <th>Môn học</th>
            <th>Giảng viên</th>
            <th>Thứ</th>
            <th>Thời gian</th>
            <th>Phòng</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="sch : ${schedules}">
            <td th:text="${sch.classRoom.className}"></td>
            <td th:text="${sch.course.courseName}"></td>
            <td th:text="${sch.teacher.fullName}"></td>
            <td th:text="${sch.dayOfWeek}"></td>
            <td th:text="${sch.startTime} + ' - ' + ${sch.endTime}"></td>
            <td th:text="${sch.room}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
