<div th:replace="~{admin/layout :: layout(~{::content})}">
    <div th:fragment="content">
        <div class="d-flex justify-content-between mb-3 align-items-center">
            <div>
                <h4 class="fw-bold mb-0">📅 Lịch Học &amp; Giảng Dạy</h4>
                <small class="text-muted">Quản lý phân công lớp + môn + giảng viên</small>
            </div>
            <a href="/admin/schedule/add" class="btn btn-dark">+ Tạo lịch học mới</a>
        </div>

        <div class="card shadow-sm">
            <table class="table table-striped mb-0">
                <thead class="table-primary">
                <tr>
                    <th>Thứ</th>
                    <th>Ngày học</th>
                    <th>Thời gian</th>
                    <th>Lớp</th>
                    <th>Môn học</th>
                    <th>Giảng viên</th>
                    <th>Phòng</th>
                    <th class="text-center">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="sch : ${schedules}" class="align-middle">
                    <td>
                        <span class="badge bg-primary" th:text="${sch.dayOfWeek}"></span>
                    </td>
                    <td th:text="${sch.scheduleDate}" class="fw-bold"></td>
                    <td th:text="${sch.startTime} + ' - ' + ${sch.endTime}" class="text-muted"></td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${sch.classRoom.className}"></span>
                    </td>
                    <td th:text="${sch.course.courseName}"></td>
                    <td th:text="${sch.teacher.fullName}"></td>
                    <td th:text="${sch.room}"></td>
                    <td class="text-center">
                        <!-- ĐÃ THÊM: nút Xóa lịch học -->
                        <a th:href="@{/admin/schedule/delete/{id}(id=${sch.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Xóa lịch học này?')">🗑 Xóa</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(schedules)}">
                    <td colspan="8" class="text-center text-muted py-3">Chưa có lịch học nào</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
