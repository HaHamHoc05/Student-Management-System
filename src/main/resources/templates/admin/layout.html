<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { height: 100vh; background: #212529; color: white; position: fixed; width: inherit; overflow-y: auto; }
        .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 12px 20px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: #343a40; color: white; border-left: 4px solid #0d6efd; }
        .sidebar .section-label { color: #6c757d; font-size: 0.7rem; text-transform: uppercase; padding: 16px 20px 4px; letter-spacing: 1px; }
        .main-content { margin-left: 16.66667%; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 p-0 sidebar">
            <h5 class="text-center py-4 border-bottom border-secondary mb-0">ADMIN PANEL</h5>

            <div class="section-label">Tổng quan</div>
            <a href="/admin/home">🏠 Dashboard</a>

            <div class="section-label">Quản lý</div>
            <a href="/admin/students">🎓 Sinh viên</a>
            <a href="/admin/teachers">👨‍🏫 Giảng viên</a>
            <a href="/admin/classes">🏫 Lớp học</a>
            <a href="/admin/courses">📚 Môn học</a>
            <a href="/admin/schedule">📅 Lịch học</a>

            <!-- THÊM MỚI: link Quản lý tài khoản -->
            <div class="section-label">Hệ thống</div>
            <a href="/admin/accounts">🔐 Tài khoản</a>

            <div class="mt-auto px-3 py-4">
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-outline-danger w-100 btn-sm" type="submit">Đăng xuất</button>
                </form>
            </div>
        </div>
        <div class="col-md-10 main-content p-4">
            <div th:replace="${content}"></div>
        </div>
    </div>
</div>
</body>
</html>
