<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { height: 100vh; background: #343a40; color: white; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 15px; }
        .sidebar a:hover { background: #495057; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center py-3">Admin Dashboard</h5>
            <a href="/admin/home">🏠 Tổng quan</a>
            <a href="/admin/students">🎓 Quản lý Sinh viên</a>
            <a href="/admin/classes">🏫 Quản lý Lớp học</a>
            <a href="/admin/schedule">📅 Quản lý Lịch học</a>
            <hr>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-danger w-100" type="submit">Đăng xuất</button>
            </form>
        </div>
        <div class="col-md-10 p-4">
            <div th:replace="~{${content}}"></div>
        </div>
    </div>
</div>
</body>
</html>
