<div th:replace="~{admin/layout :: layout(~{::content})}">
    <div th:fragment="content">
        <div class="card shadow p-4">
            <h3 class="mb-4 text-primary">Phân công Giảng dạy</h3>
            <form th:action="@{/admin/schedule/save}" th:object="${schedule}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Chọn Giảng viên</label>
                        <select th:field="*{teacher.id}" class="form-select" required>
                            <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.fullName} + ' (' + ${t.teacherCode} + ')'"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Chọn Môn học</label>
                        <select th:field="*{course.id}" class="form-select" required>
                            <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.courseName}"></option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Chọn Lớp học</label>
                        <select th:field="*{classRoom.id}" class="form-select" required>
                            <option th:each="cl : ${classes}" th:value="${cl.id}" th:text="${cl.className}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phòng học</label>
                        <input type="text" th:field="*{room}" class="form-control" placeholder="VD: A.102">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Ngày học (Thứ)</label>
                        <select th:field="*{dayOfWeek}" class="form-select">
                            <option value="Monday">Thứ 2</option>
                            <option value="Tuesday">Thứ 3</option>
                            <option value="Wednesday">Thứ 4</option>
                            <option value="Thursday">Thứ 5</option>
                            <option value="Friday">Thứ 6</option>
                            <option value="Saturday">Thứ 7</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Giờ bắt đầu</label>
                        <input type="time" th:field="*{startTime}" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Giờ kết thúc</label>
                        <input type="time" th:field="*{endTime}" class="form-control" required>
                    </div>
                </div>
                <hr>
                <div class="d-flex justify-content-end">
                    <a href="/admin/schedule" class="btn btn-secondary me-2">Hủy</a>
                    <button type="submit" class="btn btn-primary">Xác nhận Phân công</button>
                </div>
            </form>
        </div>
    </div>
</div>
