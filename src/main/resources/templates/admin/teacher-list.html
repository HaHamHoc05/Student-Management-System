<div th:replace="~{admin/layout :: layout(~{::content})}">
    <div th:fragment="content">
        <h4 class="fw-bold mb-3">👨‍🏫 Quản Lý Giảng Viên</h4>
        <div class="row">
            <!-- Form thêm/sửa -->
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <!-- Tiêu đề form thay đổi khi sửa -->
                    <h5 th:text="${teacher.id != null ? '✏️ Cập nhật Giảng Viên' : '➕ Thêm Giảng Viên'}"></h5>
                    <form th:action="@{/admin/teachers/save}" th:object="${teacher}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <input type="text" th:field="*{teacherCode}" class="form-control mb-2"
                               placeholder="Mã giảng viên" required>
                        <input type="text" th:field="*{fullName}" class="form-control mb-2"
                               placeholder="Họ và tên" required>
                        <input type="email" th:field="*{email}" class="form-control mb-2"
                               placeholder="Email">
                        <input type="text" th:field="*{phone}" class="form-control mb-2"
                               placeholder="Số điện thoại">
                        <input type="text" th:field="*{specialization}" class="form-control mb-2"
                               placeholder="Chuyên môn">
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">Lưu</button>
                            <!-- Nút hủy khi đang sửa -->
                            <a th:if="${teacher.id != null}" href="/admin/teachers"
                               class="btn btn-secondary">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Danh sách giảng viên -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <table class="table table-bordered mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th>Mã GV</th>
                            <th>Họ Tên</th>
                            <th>Chuyên môn</th>
                            <th class="text-center">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${teachers}" class="align-middle">
                            <td><span class="badge bg-secondary" th:text="${t.teacherCode}"></span></td>
                            <td class="fw-bold" th:text="${t.fullName}"></td>
                            <td class="text-muted" th:text="${t.specialization}"></td>
                            <td class="text-center">
                                <!-- ĐÃ THÊM: nút Sửa giảng viên -->
                                <a th:href="@{/admin/teachers/edit/{id}(id=${t.id})}"
                                   class="btn btn-warning btn-sm">✏️ Sửa</a>
                                <!-- ĐÃ THÊM: nút Xóa giảng viên -->
                                <a th:href="@{/admin/teachers/delete/{id}(id=${t.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Xóa giảng viên này?')">🗑 Xóa</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(teachers)}">
                            <td colspan="4" class="text-center text-muted py-3">Chưa có giảng viên nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
