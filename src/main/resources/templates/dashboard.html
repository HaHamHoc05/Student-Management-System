<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Hệ Thống Quản Lý</span>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" th:text="'Xin chào, ' + ${username}">Xin chào, User</span>

            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-danger btn-sm" type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5 text-center">
    <h1>Chào mừng bạn đến với hệ thống!</h1>
    <p class="text-muted">Chúng ta sẽ làm bảng danh sách sinh viên ở đây ở bước tiếp theo.</p>
</div>

</body>
</html>
