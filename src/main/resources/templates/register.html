<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow p-4" style="width: 400px;">
    <h3 class="text-center mb-4 text-primary">Tạo Tài Khoản</h3>

    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label class="form-label">Tên đăng nhập (Mã SV/GV)</label>
            <input type="text" class="form-control" name="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" class="form-control" name="password" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Vai trò</label>
            <select name="role" class="form-select">
                <option value="ROLE_STUDENT">Sinh viên</option>
                <option value="ROLE_TEACHER">Giáo viên</option>
                <option value="ROLE_ADMIN">Quản trị viên</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">ĐĂNG KÝ</button>
    </form>
    <div class="text-center mt-3">
        <a href="/login" class="text-decoration-none">Đã có tài khoản? Đăng nhập ngay</a>
    </div>
</div>
</body>
</html>
