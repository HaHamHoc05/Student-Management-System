<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch dạy của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .badge-day { font-size: 0.8rem; padding: 5px 10px; border-radius: 20px; }
        .card-header-green { background: linear-gradient(135deg, #198754, #20c997); }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-success shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand">👨‍🏫 TEACHER PORTAL</span>
        <div class="d-flex gap-2">
            <a href="/teacher/home" class="btn btn-outline-light btn-sm">🏠 Trang chủ</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-0 fw-bold">📅 Lịch Dạy Của Tôi</h4>
            <small class="text-muted">Danh sách các buổi giảng dạy được phân công</small>
        </div>
        <a href="/teacher/home" class="btn btn-secondary btn-sm">⬅ Quay lại</a>
    </div>

    <!-- Thông báo nếu không có lịch -->
    <div th:if="${#lists.isEmpty(schedules)}" class="alert alert-info text-center py-4">
        <h5>📭 Chưa có lịch dạy nào được phân công</h5>
        <p class="mb-0 text-muted">Vui lòng liên hệ Admin để được sắp xếp lịch giảng dạy.</p>
    </div>

    <!-- Bảng lịch dạy -->
    <div th:unless="${#lists.isEmpty(schedules)}" class="card shadow-sm">
        <div class="card-header card-header-green text-white">
            <h6 class="mb-0">📋 Thời Khóa Biểu</h6>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr class="text-center">
                    <th>Thứ</th>
                    <th>Ngày</th>
                    <th>Giờ học</th>
                    <th>Môn học</th>
                    <th>Lớp</th>
                    <th>Phòng</th>
                    <th>Điểm danh</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${schedules}" class="text-center align-middle">
                    <td>
                        <span class="badge bg-primary badge-day" th:text="${s.dayOfWeek}"></span>
                    </td>
                    <td th:text="${s.scheduleDate}" class="fw-bold"></td>
                    <td>
                        <span class="text-success fw-bold" th:text="${s.startTime}"></span>
                        <span class="text-muted"> → </span>
                        <span class="text-danger fw-bold" th:text="${s.endTime}"></span>
                    </td>
                    <td class="text-start">
                        <span class="fw-bold" th:text="${s.course.courseName}"></span>
                        <br>
                        <small class="text-muted badge bg-light text-dark" th:text="${s.course.courseCode}"></small>
                    </td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${s.classRoom.className}"></span>
                    </td>
                    <td>
                        <span class="badge bg-secondary" th:text="${s.room}"></span>
                    </td>
                    <td>
                        <!-- Link tới trang điểm danh lớp học cụ thể -->
                        <a th:href="@{/teacher/attendance/class/{id}(id=${s.id})}"
                           class="btn btn-sm btn-outline-success">
                            ✅ Điểm danh
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Tổng số buổi -->
    <div th:unless="${#lists.isEmpty(schedules)}" class="mt-3 text-end">
        <small class="text-muted">
            Tổng cộng: <strong th:text="${#lists.size(schedules)}"></strong> buổi dạy
        </small>
    </div>
</div>
</body>
</html>
