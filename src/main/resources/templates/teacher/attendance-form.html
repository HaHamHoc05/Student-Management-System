<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Điểm danh Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">✅ Điểm Danh Thủ Công</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/teacher/attendance/save}" th:object="${attendance}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Sinh viên</label>
                    <select th:field="*{student.id}" class="form-select" required>
                        <option value="">-- Chọn sinh viên --</option>
                        <option th:each="s : ${students}"
                                th:value="${s.id}"
                                th:text="${s.fullName + ' (' + s.studentCode + ')'}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Môn học</label>
                    <select th:field="*{course.id}" class="form-select" required>
                        <option value="">-- Chọn môn học --</option>
                        <option th:each="c : ${courses}"
                                th:value="${c.id}"
                                th:text="${c.courseName}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Ngày điểm danh</label>
                    <input type="date" th:field="*{date}" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Trạng thái</label>
                    <select th:field="*{status}" class="form-select" required>
                        <option value="PRESENT">✅ Có mặt</option>
                        <option value="ABSENT_PERMISSION">📝 Vắng có phép</option>
                        <option value="ABSENT_NO_PERMISSION">❌ Vắng không phép</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success flex-fill">Lưu điểm danh</button>
                    <a href="/teacher/attendance" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
