<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="p-4">
<div class="container">
    <div class="d-flex justify-content-between mb-3">
        <h3>Quản lý Điểm Số</h3>
        <a href="/teacher/grades/add" class="btn btn-success">+ Nhập điểm</a>
        <a href="/teacher/home" class="btn btn-secondary">Quay lại</a>
    </div>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr><th>Sinh viên</th><th>Môn học</th><th>Giữa kỳ</th><th>Cuối kỳ</th><th>Tổng</th><th>Hệ 4</th><th>Chữ</th></tr>
        </thead>
        <tbody>
        <tr th:each="g : ${grades}">
            <td th:text="${g.student.fullName}"></td>
            <td th:text="${g.course.courseName}"></td>
            <td th:text="${g.midTerm}"></td>
            <td th:text="${g.finalExam}"></td>
            <td th:text="${g.total}" class="fw-bold text-danger"></td>
            <td th:text="${g.gpa}"></td>
            <td th:text="${g.letterGrade}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
