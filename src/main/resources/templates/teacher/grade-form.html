<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="p-4">
<div class="container" style="max-width: 600px;">
    <h3>Nhập Điểm Sinh Viên</h3>
    <form th:action="@{/teacher/grades/save}" th:object="${gradeDTO}" method="post" class="card p-4 shadow">
        <label>Sinh viên</label>
        <select th:field="*{studentId}" class="form-select mb-3">
            <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.fullName} + ' (' + ${s.studentCode} + ')'"></option>
        </select>
        <label>Môn học</label>
        <select th:field="*{courseId}" class="form-select mb-3">
            <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.courseName}"></option>
        </select>
        <div class="row mb-3">
            <div class="col"><label>Điểm giữa kỳ</label><input type="number" step="0.1" th:field="*{midTerm}" class="form-control" required></div>
            <div class="col"><label>Điểm cuối kỳ</label><input type="number" step="0.1" th:field="*{finalExam}" class="form-control" required></div>
        </div>
        <button type="submit" class="btn btn-success">Lưu Điểm</button>
        <a href="/teacher/grades" class="btn btn-secondary mt-2">Hủy</a>
    </form>
</div>
</body>
</html>
